services:
  # ============================================================================
  # Backend API Service
  # ============================================================================
  - type: web
    name: prepmind-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: builtin
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ============================================================================
  # Frontend Web Service
  # ============================================================================
  - type: web
    name: prepmind-ai-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://prepmind-ai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
